<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MewHelp 数据流转流程图</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f6f7f9;color:#1f2328;
    font:14px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;}
  .wrap{max-width:1240px;margin:0 auto;padding:32px 24px 80px}
  h1{margin:0 0 4px;font-size:20px;font-weight:650;letter-spacing:.2px}
  .sub{color:#656d76;font-size:13px;margin-bottom:22px}
  .canvas{background:#fff;border:1px solid #d8dee4;border-radius:12px;
    padding:8px;overflow:auto;box-shadow:0 1px 3px rgba(31,35,40,.06)}
  svg{display:block;margin:0 auto;max-width:100%;height:auto}
  .n rect{stroke-width:1.4}
  .n text{font-size:13px;fill:#1f2328}
  .n .sub2{font-size:11px;fill:#656d76}
  .api rect{fill:#ddf4ff;stroke:#54aeff}
  .svc rect{fill:#fbefff;stroke:#c297ff}
  .gph rect{fill:#dafbe1;stroke:#4ac26b}
  .mdl rect{fill:#fff1e5;stroke:#fb8f44}
  .db  rect{fill:#e7f0ff;stroke:#6ea8fe}
  .fix rect{fill:#f6f8fa;stroke:#afb8c1}
  .bad rect{fill:#ffebe9;stroke:#ff8182}
  .cont rect{fill:#fbfbfd;stroke:#4ac26b;stroke-width:1.8}
  .a{stroke:#57606a;stroke-width:1.6;fill:none}
  .a-dash{stroke:#8c959f;stroke-width:1.4;fill:none;stroke-dasharray:4 3}
  .a-lab{font-size:11px;fill:#57606a}
  .badge{font-size:10.5px;font-weight:700;fill:#fff}
  .badge-bg{fill:#fb8f44}
  .panel rect{fill:#fbfcfd;stroke:#d8dee4}
  .panel .h{font-size:12px;font-weight:700;fill:#1f2328}
  .panel .i{font-size:11.5px;fill:#424a53}
  .panel .d{font-size:10.5px;fill:#656d76}
  .lg text{font-size:11.5px;fill:#424a53}
  .er rect{fill:#fff5f5;stroke:#ff8182;stroke-width:1.5;stroke-dasharray:5 3}
  .er .eh{font-size:11px;font-weight:700;fill:#cf222e}
  .er .eb{font-size:10.5px;fill:#424a53}
  .er .ec{font-size:10px;fill:#656d76}
  .err-link{stroke:#ff8182;stroke-width:1.3;fill:none;stroke-dasharray:3 3}
</style>
</head>
<body>
<div class="wrap">
  <h1>MewHelp 单次请求数据流转</h1>
  <div class="sub">POST /api/chat → 模型输出 → 落库 → SSE · 依据当前代码（commit 872d651）</div>

  <div class="canvas">
  <svg viewBox="0 0 1180 1500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="数据流转流程图">
    <defs>
      <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
      </marker>
      <marker id="ar-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
      </marker>
      <marker id="ar-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#4ac26b"/>
      </marker>
    </defs>

    <!-- ===== 图例 ===== -->
    <g class="lg" transform="translate(24,16)">
      <rect x="0" y="0" width="18" height="12" rx="3" fill="#ddf4ff" stroke="#54aeff"/>
      <text x="24" y="10">API</text>
      <rect x="70" y="0" width="18" height="12" rx="3" fill="#fbefff" stroke="#c297ff"/>
      <text x="94" y="10">服务层</text>
      <rect x="156" y="0" width="18" height="12" rx="3" fill="#dafbe1" stroke="#4ac26b"/>
      <text x="180" y="10">图节点</text>
      <rect x="246" y="0" width="18" height="12" rx="3" fill="#fff1e5" stroke="#fb8f44"/>
      <text x="270" y="10">模型调用</text>
      <rect x="348" y="0" width="18" height="12" rx="3" fill="#e7f0ff" stroke="#6ea8fe"/>
      <text x="372" y="10">持久化</text>
      <rect x="440" y="0" width="18" height="12" rx="3" fill="#ffebe9" stroke="#ff8182"/>
      <text x="464" y="10">失败出口</text>
    </g>

    <!-- ================= 主干 ================= -->

    <!-- N1 客户端 -->
    <g class="n api">
      <rect x="290" y="80" width="280" height="54" rx="9"/>
      <text x="430" y="104" text-anchor="middle">客户端</text>
      <text x="430" y="122" text-anchor="middle" class="sub2">POST /api/chat</text>
    </g>
    <path class="a" d="M430 134 L430 160" marker-end="url(#ar)"/>

    <!-- N2 校验 -->
    <g class="n api">
      <rect x="290" y="160" width="280" height="54" rx="9"/>
      <text x="430" y="184" text-anchor="middle">请求校验</text>
      <text x="430" y="202" text-anchor="middle" class="sub2">ChatRequest · 失败直接 422</text>
    </g>
    <path class="a" d="M430 214 L430 240" marker-end="url(#ar)"/>

    <!-- N3 并发守卫 -->
    <g class="n svc">
      <rect x="290" y="240" width="280" height="54" rx="9"/>
      <text x="430" y="264" text-anchor="middle">并发守卫</text>
      <text x="430" y="282" text-anchor="middle" class="sub2">同会话互斥 · 忙则拒绝</text>
    </g>
    <path class="a" d="M430 294 L430 320" marker-end="url(#ar)"/>

    <!-- N4 写库 -->
    <g class="n db">
      <rect x="290" y="320" width="280" height="54" rx="9"/>
      <text x="430" y="344" text-anchor="middle">写入用户消息</text>
      <text x="430" y="362" text-anchor="middle" class="sub2">MySQL · turn_status=running</text>
    </g>
    <path class="a" d="M430 374 L430 400" marker-end="url(#ar)"/>

    <!-- N5 状态装配 -->
    <g class="n svc">
      <rect x="290" y="400" width="280" height="54" rx="9"/>
      <text x="430" y="424" text-anchor="middle">状态装配</text>
      <text x="430" y="442" text-anchor="middle" class="sub2">checkpoint 核验 + 游标增量对账</text>
    </g>
    <path class="a" d="M430 454 L430 480" marker-end="url(#ar)"/>

    <!-- N6 -->
    <g class="n gph">
      <rect x="290" y="480" width="280" height="54" rx="9"/>
      <text x="430" y="504" text-anchor="middle">resolve_reference</text>
      <text x="430" y="522" text-anchor="middle" class="sub2">原话透传（不改写）</text>
    </g>
    <path class="a" d="M430 534 L430 560" marker-end="url(#ar)"/>

    <!-- N7 分类 -->
    <g class="n mdl">
      <rect x="290" y="560" width="280" height="54" rx="9"/>
      <circle cx="322" cy="576" r="9" class="badge-bg"/>
      <text x="322" y="580" text-anchor="middle" class="badge">1</text>
      <text x="430" y="584" text-anchor="middle">classify_intent</text>
      <text x="430" y="602" text-anchor="middle" class="sub2">强制 submit_intent 工具</text>
    </g>
    <path class="a" d="M430 614 L430 640" marker-end="url(#ar)"/>

    <!-- N8 路由 -->
    <g class="n gph">
      <rect x="290" y="640" width="280" height="54" rx="9"/>
      <text x="430" y="664" text-anchor="middle">route_by_intent</text>
      <text x="430" y="682" text-anchor="middle" class="sub2">四出口分流</text>
    </g>

    <!-- 分支：投诉/闲聊 -->
    <path class="a" d="M290 667 L268 667 L268 727 L252 727" marker-end="url(#ar)"/>
    <g class="n fix">
      <rect x="20" y="700" width="232" height="54" rx="9"/>
      <text x="136" y="724" text-anchor="middle">投诉 / 闲聊</text>
      <text x="136" y="742" text-anchor="middle" class="sub2">固定回复 · 不调模型</text>
    </g>
    <path class="a-dash" d="M136 754 L136 796" marker-end="url(#ar-d)"/>
    <text x="146" y="780" class="a-lab">汇入 log_turn</text>

    <!-- 主干继续 -->
    <path class="a" d="M430 694 L430 730" marker-end="url(#ar)"/>

    <!-- N9 检索 -->
    <g class="n mdl">
      <rect x="290" y="730" width="280" height="54" rx="9"/>
      <circle cx="322" cy="746" r="9" class="badge-bg"/>
      <text x="322" y="750" text-anchor="middle" class="badge">2</text>
      <text x="430" y="754" text-anchor="middle">retrieve_knowledge</text>
      <text x="430" y="772" text-anchor="middle" class="sub2">改写 → 混合检索 → 重排</text>
    </g>
    <path class="a" d="M430 784 L430 830" marker-end="url(#ar)"/>

    <!-- N10 证据闸 -->
    <g class="n gph">
      <rect x="290" y="830" width="280" height="54" rx="9"/>
      <text x="430" y="854" text-anchor="middle">confidence_check</text>
      <text x="430" y="872" text-anchor="middle" class="sub2">最高重排分 ≥ 0.3 ？</text>
    </g>

    <!-- 分支：拒答 -->
    <path class="a" d="M290 857 L268 857 L268 927 L252 927" marker-end="url(#ar)"/>
    <g class="n bad">
      <rect x="20" y="900" width="232" height="54" rx="9"/>
      <text x="136" y="924" text-anchor="middle">固定拒答</text>
      <text x="136" y="942" text-anchor="middle" class="sub2">低分且非业务意图</text>
    </g>
    <path class="a-dash" d="M136 954 L136 996" marker-end="url(#ar-d)"/>
    <text x="146" y="980" class="a-lab">汇入 log_turn</text>

    <!-- 分支：业务意图低分 -->
    <path class="a" d="M570 857 L592 857 L592 927 L608 927" marker-end="url(#ar)"/>
    <g class="n fix">
      <rect x="608" y="900" width="200" height="54" rx="9"/>
      <text x="708" y="924" text-anchor="middle">清空证据继续</text>
      <text x="708" y="942" text-anchor="middle" class="sub2">低分但业务意图</text>
    </g>

    <!-- 主干进入 main_agent -->
    <path class="a" d="M430 884 L430 980" marker-end="url(#ar)"/>
    <text x="440" y="930" class="a-lab">通过 / 业务低分</text>

    <!-- N11 main_agent 容器 -->
    <g class="cont">
      <rect x="180" y="980" width="520" height="240" rx="12"/>
      <text x="200" y="1006" font-size="12.5" font-weight="700" fill="#1a7f37">main_agent 子图（ReAct 循环）</text>
    </g>

    <!-- 内部 decision -->
    <g class="n mdl">
      <rect x="228" y="1020" width="172" height="48" rx="8"/>
      <circle cx="256" cy="1034" r="8" class="badge-bg"/>
      <text x="256" y="1038" text-anchor="middle" class="badge">3</text>
      <text x="314" y="1048" text-anchor="middle">decision</text>
    </g>
    <!-- 内部 tools -->
    <g class="n gph">
      <rect x="470" y="1020" width="172" height="48" rx="8"/>
      <text x="556" y="1048" text-anchor="middle">tools</text>
    </g>
    <!-- 内部 answer -->
    <g class="n mdl">
      <rect x="228" y="1140" width="172" height="48" rx="8"/>
      <circle cx="256" cy="1154" r="8" class="badge-bg"/>
      <text x="256" y="1158" text-anchor="middle" class="badge">4</text>
      <text x="314" y="1168" text-anchor="middle">answer</text>
    </g>

    <!-- 内部箭头 -->
    <path class="a" d="M400 1044 L470 1044" marker-end="url(#ar)"/>
    <text x="435" y="1037" text-anchor="middle" class="a-lab">tool_calls</text>
    <path class="a" d="M556 1068 L556 1104 L314 1104 L314 1068" marker-end="url(#ar)"/>
    <text x="440" y="1098" text-anchor="middle" class="a-lab">结果回灌 · 循环</text>
    <path class="a" d="M268 1068 L268 1140" marker-end="url(#ar)"/>
    <text x="276" y="1108" class="a-lab">submit_decision</text>

    <!-- 主干继续 -->
    <path class="a" d="M430 1220 L430 1260" marker-end="url(#ar)"/>

    <!-- N12 log_turn -->
    <g class="n db">
      <rect x="290" y="1260" width="280" height="54" rx="9"/>
      <text x="430" y="1284" text-anchor="middle">log_turn</text>
      <text x="430" y="1302" text-anchor="middle" class="sub2">正文 + 引用 + 建议 → MySQL</text>
    </g>
    <path class="a" d="M430 1314 L430 1340" marker-end="url(#ar)"/>

    <!-- N13 终态核验 -->
    <g class="n svc">
      <rect x="290" y="1340" width="280" height="54" rx="9"/>
      <text x="430" y="1364" text-anchor="middle">终态核验</text>
      <text x="430" y="1382" text-anchor="middle" class="sub2">未通过则不发布完成帧</text>
    </g>
    <path class="a" d="M430 1394 L430 1420" marker-end="url(#ar)"/>

    <!-- N14 SSE -->
    <g class="n api">
      <rect x="290" y="1420" width="280" height="54" rx="9"/>
      <text x="430" y="1444" text-anchor="middle">SSE 输出</text>
      <text x="430" y="1462" text-anchor="middle" class="sub2">delta · tool_status · metadata · done</text>
    </g>

    <!-- ===== 右侧说明面板 ===== -->
    <g class="panel">
      <rect x="850" y="80" width="306" height="404" rx="10"/>
      <text x="870" y="108" class="h">模型调用点</text>

      <circle cx="878" cy="132" r="8" class="badge-bg"/>
      <text x="878" y="136" text-anchor="middle" class="badge">1</text>
      <text x="894" y="136" class="i">classify_intent</text>
      <text x="894" y="152" class="d">submit_intent 强制绑定</text>
      <text x="894" y="167" class="d">输出：意图 + 知识问题</text>

      <circle cx="878" cy="196" r="8" class="badge-bg"/>
      <text x="878" y="200" text-anchor="middle" class="badge">2</text>
      <text x="894" y="200" class="i">retrieve_knowledge</text>
      <text x="894" y="216" class="d">submit_query_rewrite 强制绑定</text>
      <text x="894" y="231" class="d">输出：标准问法 + 同义词</text>

      <circle cx="878" cy="260" r="8" class="badge-bg"/>
      <text x="878" y="264" text-anchor="middle" class="badge">3</text>
      <text x="894" y="264" class="i">main_agent.decision</text>
      <text x="894" y="280" class="d">3 个只读工具 + submit_decision</text>
      <text x="894" y="295" class="d">上限 5 次决策</text>

      <circle cx="878" cy="324" r="8" class="badge-bg"/>
      <text x="878" y="328" text-anchor="middle" class="badge">4</text>
      <text x="894" y="328" class="i">main_agent.answer</text>
      <text x="894" y="344" class="d">不绑工具 · 真流式</text>
      <text x="894" y="359" class="d">空正文补一次 NUDGE</text>

      <line x1="870" y1="380" x2="1136" y2="380" stroke="#d8dee4"/>
      <text x="870" y="402" class="d">闲聊 / 投诉：仅 ①，其余固定回复</text>
      <text x="870" y="420" class="d">纯知识问答：①②③④</text>
      <text x="870" y="438" class="d">带工具查询：①②③…③④</text>
      <text x="870" y="462" class="d">全部调用共用同一预算账本</text>
    </g>

    <!-- 右侧：检索细节 -->
    <g class="panel">
      <rect x="850" y="512" width="306" height="222" rx="10"/>
      <text x="870" y="540" class="h">检索与改写</text>
      <text x="870" y="566" class="i">改写器可见可信历史</text>
      <text x="870" y="583" class="d">只补对象 / 主题，不引入政策事实</text>
      <text x="870" y="608" class="i">校验规则</text>
      <text x="870" y="625" class="d">型号必须保留</text>
      <text x="870" y="642" class="d">订单号不得被历史标识顶替</text>
      <text x="870" y="659" class="d">金额 / 天数可概括，不可篡改</text>
      <text x="870" y="676" class="d">超出白名单的数字 → 拒绝</text>
      <line x1="870" y1="692" x2="1136" y2="692" stroke="#d8dee4"/>
      <text x="870" y="712" class="d">退款退货走三角度扩展检索</text>
    </g>

    <!-- 右侧：失败与不变量 -->
    <g class="panel">
      <rect x="850" y="762" width="306" height="200" rx="10"/>
      <text x="870" y="790" class="h">失败出口</text>
      <text x="870" y="816" class="d">取消 → 原样上抛，不吞异常</text>
      <text x="870" y="834" class="d">工具决策非法 → 存审计后 error</text>
      <text x="870" y="852" class="d">预算超限 → budget_exceeded</text>
      <text x="870" y="870" class="d">正文两次为空 → 输出错误</text>
      <line x1="870" y1="886" x2="1136" y2="886" stroke="#d8dee4"/>
      <text x="870" y="906" class="i">不变量</text>
      <text x="870" y="924" class="d">done 帧仅在</text>
      <text x="870" y="942" class="d">MySQL 提交 + 终态核验</text>
      <text x="870" y="960" class="d">都成功之后才发出</text>
    </g>

    <!-- 右侧：状态与历史 -->
    <g class="panel">
      <rect x="850" y="992" width="306" height="228" rx="10"/>
      <text x="870" y="1020" class="h">状态与历史</text>
      <text x="870" y="1046" class="d">线程键：会话主键派生</text>
      <text x="870" y="1064" class="d">MySQL 存消息与终态</text>
      <text x="870" y="1082" class="d">SQLite 存工作流检查点</text>
      <line x1="870" y1="1098" x2="1136" y2="1098" stroke="#d8dee4"/>
      <text x="870" y="1118" class="i">历史来源</text>
      <text x="870" y="1136" class="d">按消息游标增量拉取</text>
      <text x="870" y="1154" class="d">不靠重放模型消息</text>
      <text x="870" y="1172" class="d">按整轮裁剪，当前轮不裁</text>
      <line x1="870" y1="1188" x2="1136" y2="1188" stroke="#d8dee4"/>
      <text x="870" y="1208" class="d">身份不符时丢弃旧检查点</text>
    </g>


    <!-- ===== 历史错误产生位置 ===== -->
    <g class="er">
      <!-- E1 classify_intent -->
      <rect x="596" y="546" width="222" height="82" rx="8"/>
      <text x="610" y="566" class="eh">错误 ①</text>
      <text x="610" y="583" class="eb">模型把空值写成字符串</text>
      <text x="610" y="598" class="eb">被结构校验拒绝 → 整轮失败</text>
      <text x="610" y="616" class="ec">修复：schema 层确定性还原</text>
      <path class="err-link" d="M596 587 L574 587"/>

      <!-- E2 retrieve_knowledge / 改写校验 -->
      <rect x="596" y="716" width="222" height="100" rx="8"/>
      <text x="610" y="736" class="eh">错误 ② ③</text>
      <text x="610" y="753" class="eb">金额被当成必须保留的数值</text>
      <text x="610" y="768" class="eb">改写概括掉金额 → 判为丢失</text>
      <text x="610" y="783" class="eb">改写器拿不到历史 → 判为编造</text>
      <text x="610" y="801" class="ec">修复：改为「不得编造」+ 传历史</text>
      <path class="err-link" d="M596 757 L574 757"/>

      <!-- E3 log_turn -->
      <rect x="596" y="1246" width="222" height="82" rx="8"/>
      <text x="610" y="1266" class="eh">错误 ④</text>
      <text x="610" y="1283" class="eb">业务意图低分仍标记弱证据</text>
      <text x="610" y="1298" class="eb">正文非拒答话术 → 仓储拒收</text>
      <text x="610" y="1316" class="ec">修复：仅真拒答轮次才入池</text>
      <path class="err-link" d="M596 1287 L574 1287"/>
    </g>
  </svg>
  </div>
</div>
</body>
</html>
