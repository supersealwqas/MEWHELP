# 本机 CH09 独立项目：与业务 MySQL / Milvus 分开存储，只暴露回环端口。
# 使用：docker compose --env-file .env.langfuse -f docker-compose.langfuse.yml -p mewhelp-langfuse up -d
services:
  langfuse-worker:
    image: langfuse/langfuse-worker:4.72.0@sha256:aa1724b989a00f1e4ca9930709202489c73deaaf2f1116bbd3d71c77edb8fedb
    restart: unless-stopped
    depends_on: &dependencies
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    ports: ["127.0.0.1:13030:3030"]
    healthcheck:
      # 镜像服务监听容器网卡地址；使用实际主机名，不能假定容器回环也有监听。
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://'+require('node:os').hostname()+':3030/api/health',{signal:AbortSignal.timeout(4000)})
          .then(r=>{if(!r.ok)console.error('healthcheck HTTP',r.status);process.exitCode=r.ok?0:1})
          .catch(e=>{console.error('healthcheck',e.name,e.cause?.code??'request_failed');process.exitCode=1})
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    environment: &environment
      NEXTAUTH_URL: http://127.0.0.1:13000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?}@postgres:5432/langfuse
      SALT: ${SALT:?}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_DISABLE_SIGNUP_ONBOARDING: "true"
      LANGFUSE_IN_APP_AGENT_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_AUTH: ${REDIS_AUTH:?}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"

  langfuse-web:
    image: langfuse/langfuse:4.72.0@sha256:c311fd9db4b69f6514fdcb1b86a2a105d5a4ed51fbf0ded033ff2722459c804a
    restart: unless-stopped
    depends_on: *dependencies
    ports: ["127.0.0.1:13000:3000"]
    environment:
      <<: *environment
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://127.0.0.1:19090
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
      LANGFUSE_INIT_ORG_ID: mewhelp-local
      LANGFUSE_INIT_ORG_NAME: MewHelp Local
      LANGFUSE_INIT_PROJECT_ID: mewhelp-ch09
      LANGFUSE_INIT_PROJECT_NAME: MewHelp CH09
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:?}
      LANGFUSE_INIT_USER_NAME: MewHelp Local Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://'+require('node:os').hostname()+':3000/api/public/health',{signal:AbortSignal.timeout(4000)})
          .then(r=>{if(!r.ok)console.error('healthcheck HTTP',r.status);process.exitCode=r.ok?0:1})
          .catch(e=>{console.error('healthcheck',e.name,e.cause?.code??'request_failed');process.exitCode=1})
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  postgres:
    image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: langfuse
      TZ: UTC
    volumes: ["langfuse_postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d langfuse"]
      interval: 3s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:25.12@sha256:8a790dd3468db22b1d4e7b18a176f378ff5ff6053b9c48dd4ea1fa71a24c5ba6
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.6@sha256:a9cc41d6d01da2aa26c219e4f99ecbeead955a7b656c1c499cce8922311b2514
    restart: unless-stopped
    environment: {REDIS_AUTH: "${REDIS_AUTH:?}"}
    command: ["redis-server", "--requirepass", "${REDIS_AUTH:?}", "--maxmemory-policy", "noeviction"]
    volumes: ["langfuse_redis_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_AUTH redis-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: cgr.dev/chainguard/minio@${MINIO_IMAGE_DIGEST:?}
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    ports: ["127.0.0.1:19090:9000"]
    volumes: ["langfuse_minio_data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_redis_data:
  langfuse_minio_data:
