[project]
name = "mewhelp"
version = "0.1.0"
description = "MewHelp E-commerce Customer Service AI Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.51.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.14.2",
    "langchain-core>=0.3.0",
    "langchain-openai>=1.3.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
