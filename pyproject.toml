[project]
name = "mewhelp"
version = "0.1.0"
description = "MewHelp E-commerce Customer Service AI Backend"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.0,<5",
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.51.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.14.2",
    "langchain-core>=0.3.0",
    "langchain-openai>=1.3.5",
    "openai==3.31.0",
    "langchain-text-splitters>=1.1.2",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncmy>=0.2.16,<0.3",
    "flagembedding==1.4.2",
    "pymilvus==2.6.17",
    "markdown-it-py==4.2.0",
    "torch==2.11.0",
    "tzdata==2026.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
    # Jupyter notebook 内核支持；同时锁定 debugpy、psutil、pyzmq 等运行依赖，
    # 避免 uv sync 将 VS Code 写入 .venv 的 notebook 组件视为多余包而尝试删除。
    "ipykernel>=6.29.0",
]

[tool.pytest.ini_options]
addopts = "-m 'not mysql'"
markers = [
    "mysql: 仅操作 mewhelp_test 的真实 MySQL 集成测试",
    "knowledge_integration: 显式开启并仅操作 mewhelp_ch03_test 的 CH03 集成测试",
]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
