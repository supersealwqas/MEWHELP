# Milvus 2.6.22 Standalone 本地编排（CH03 知识库 RAG 链路依赖）。
# CH04 客户端锁定 pymilvus 2.6.17，以支持原生 BM25；旧 CH03 验证记录见 docs/ch03-runbook.md。
#
# 项目主 compose.yaml 只定义 MySQL；但 app/main.py 启动时即执行
# 在线检索的 ensure_ready(create=False)，要求 MILVUS_URI 可达且目标集合已准备，
# 因此把 Milvus 及其依赖（etcd 元数据、minio 对象存储）拆到本文件，
# 用同一 compose 项目名并入同一网络，避免与主 compose 互相干扰。
#
# 启动方式：
#   docker compose -f compose.yaml -f compose.milvus.yaml up -d
#
# 端口默认 19530/9091，与 app/config.py 的 milvus_uri 默认值保持一致。

name: mewhelp-ch02

services:
  # Milvus 元数据存储：保存集合 schema、segment 状态与会话信息。
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    restart: unless-stopped
    environment:
      # 按 revision 自动压实，避免 etcd 数据无限增长。
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      # 后端存储配额 4GiB，超限时 etcd 会进入只读告警态。
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - milvus_etcd_data:/etcd
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Milvus 对象存储：保存 segment 数据文件与索引文件。
  # 固定 2026-10-22 本机已运行的 Chainguard 镜像，避免 latest 漂移。
  # 镜像摘要从本地 RepoDigests 核对；启动命令需显式指定 entrypoint。
  minio:
    image: cgr.dev/chainguard/minio@sha256:ad134b2dd572ae0d989d6807c3e45516cc75a34883a8021db2ff04be5d1d496a
    restart: unless-stopped
    entrypoint: sh
    command:
      - -c
      - minio server --address ":9000" --console-address ":9001" /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - milvus_minio_data:/data
    healthcheck:
      # Chainguard 镜像自带 mc 客户端，用 ready 子命令判断服务可用。
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Milvus 单机版：同时承载 proxy、query、data、index 等组件。
  milvus:
    image: milvusdb/milvus:v2.6.22
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      # 只绑定回环地址，禁止外部网络直连本地向量库。
      - "127.0.0.1:${MILVUS_PORT:-19530}:19530"
      - "127.0.0.1:${MILVUS_HEALTH_PORT:-9091}:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      # 冷启动需要加载 segment 元数据，给足 90 秒再开始判定健康。
      start_period: 90s
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  milvus_etcd_data:
  milvus_minio_data:
  milvus_data:
